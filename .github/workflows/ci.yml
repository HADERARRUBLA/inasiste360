name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (cálculo de nómina)
        run: npm test
      - name: Build
        run: npm run build
      # Informativo por ahora: hay ~170 errores heredados (casi todos "no-explicit-any").
      # Se vuelve bloqueante cuando se limpie esa deuda.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true
